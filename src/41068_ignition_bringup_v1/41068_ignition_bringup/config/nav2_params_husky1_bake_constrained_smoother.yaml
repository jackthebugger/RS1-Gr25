# Wave 2 bake-off OVERLAY — ConstrainedSmoother (optional).
# Applied only when smoother_bake:=constrained (or listed in nav2_params_overlay).
# Production default remains SimpleSmoother. Diff-drive: min turning radius 0
# and reversing_enabled false (paths often lack orientations for cusp logic).
#
# Soft-cost note: w_cost nudges path away from inflation; do not also raise
# production inflation_radius without bake evidence.
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_constrained_smoother/ConstrainedSmoother
      reversing_enabled: false
      path_downsampling_factor: 3
      path_upsampling_factor: 1
      keep_start_orientation: true
      keep_goal_orientation: true
      minimum_turning_radius: 0.0
      w_curve: 0.0
      w_dist: 0.0
      w_smooth: 2000000.0
      w_cost: 0.015
      w_cost_cusp_multiplier: 1.0
      cusp_zone_length: 2.5
      optimizer:
        max_iterations: 70
        debug_optimizer: false
        gradient_tol: 5.0e3
        fn_tol: 1.0e-15
        param_tol: 1.0e-20
