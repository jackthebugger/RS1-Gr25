# NOTE ON AMCL
# This block is INERT. Nav2 is started through nav2_bringup/navigation_launch.py
# (see 41068_navigation.launch.py), which brings up only controller_server,
# smoother_server, planner_server, behavior_server, bt_navigator,
# waypoint_follower and velocity_smoother. AMCL and map_server live in
# nav2_bringup/localization_launch.py, which this package never includes, so no
# AMCL node ever runs and there is no competing publisher of husky1_map ->
# husky1_odom. SLAM Toolbox is the sole owner of that transform.
# tf_broadcast is nevertheless set to false so that if anyone later adds
# localization_launch.py while SLAM is running, the TF tree stays single-owner.
amcl:
  ros__parameters:
    use_sim_time: true
    tf_broadcast: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: husky1_base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: husky1_map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: husky1_odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: husky1_map
    robot_base_frame: husky1_base_link
    odom_topic: odom
    bt_loop_duration: 10
    # Entry 028: 20 ms was shorter than IsPathValid footprintCostAtPose on the
    # 120 m global costmap, so the BT node timed out every RateController tick
    # and ComputePathToPose ran at 1 Hz. 250 ms covers the service + margin.
    default_server_timeout: 250
    wait_for_service_timeout: 1000
    # ROUTE STABILITY (Entry 016): do not use the stock 1 Hz always-replan BT.
    # That tree called ComputePathToPose every second; NavFn then flipped between
    # forest Path A and Path B whenever costmap costs tipped, trapping the Husky
    # in A↔B oscillation. This tree keeps the current path while IsPathValid
    # succeeds and only replans when the path is blocked or the goal changes.
    # Path is rewritten to the package share copy by 41068_navigation.launch.py;
    # the Humble stock path below is the fallback if params are loaded bare.
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_recovery_and_replanning_only_if_path_becomes_invalid.xml"
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    - nav2_is_battery_charging_condition_bt_node
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true
controller_server:
  ros__parameters:
    use_sim_time: true
    # 10 Hz control matches the 10 Hz lidar and the 10 Hz local costmap, so a
    # newly detected obstacle can influence the very next velocity command.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # Must be ≥ FollowPath.max_allowed_time_to_collision_up_to_carrot (3.0).
    # 0.3 aborted FollowPath during legitimate rotate-to-heading / brief wall
    # skim on bush_trail before RPP could recover (path_bank_nav clean loop).
    failure_tolerance: 3.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      # Must move 0.25 m within the allowance or the BT runs recovery. Bush
      # trail terrain legitimately pauses the robot while rotating onto a
      # fresh plan; 60 s reduces false "Failed to make progress" aborts.
      required_movement_radius: 0.25
      movement_time_allowance: 60.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      # Tight enough that "goal reached" means the robot is actually at the
      # goal. The original 1.0 m / 90 deg tolerance let it stop a full robot
      # length away and still report success.
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35
    FollowPath:
      # Entry 054 ADOPT: MPPI DiffDrive replaced RPP after controlled R1 bake
      # (NavFn+MPPI 5/5 vs NavFn+RPP 1/5 at test_speed:=false, plugin-verified).
      # Velocity envelope matches prior RPP/velocity_smoother (vx 0.5, wz 1.2).
      # CostCritic uses footprint; collision_cost keeps hard stop on lethal.
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 40
      model_dt: 0.1
      batch_size: 1500
      vx_std: 0.2
      vy_std: 0.0
      # W1c: wz_std 0.35→0.25 after motion baseline (reduce ω chatter at Fast 0.50).
      # Do not raise vx_max here — GUI Fast lockstep owns staged speed eval.
      wz_std: 0.25
      vx_max: 0.5
      vx_min: -0.35
      vy_max: 0.0
      wz_max: 1.2
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      motion_model: DiffDrive
      visualize: false
      regenerate_noises: false
      retry_attempt_limit: 1
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 12
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
# FOOTPRINT AND INFLATION
# The Husky chassis is 0.987 x 0.571 m and the wheels widen it to about 0.685 m
# (wheel centres at y = +-0.2854, wheel width 0.1143). Footprint below is the
# real hull plus a small margin (half-size 0.55 x 0.38 → inscribed ≈ 0.38 m).
#
# Clearance model (Entry 018 / bush_trail): inflation must leave a free band
# inside the trail corridors. Offline planning on bush_trail_world showed
# centreline clearance ≈0.4–0.5 m after a 0.38 m footprint inflate, i.e. trail
# half-width ≈0.8 m (full width ≈1.6 m). Entry 017's 1.60 m inflation (tuned
# for custom_world_1's ≈5.68 m forest gaps) sealed those trails on the live
# costmap and caused continuous IsPathValid replans with no progress.
#
#   inscribed ≈ 0.38 m (footprint half-width)
#   inflation 0.70 m → soft free-band edge ~0.70 m from lethal (≈0.32 m
#     body-side margin). Keeps bush trails open while still preferring
#     centre-of-corridor over knife-edge wall skims.
#   cost_scaling 2.5 → moderate soft-cost decay.
#
# custom_world_1 Gap A/B (≈5.68 m) still retain a wide free band at 0.70 m.
local_costmap:
  local_costmap:
    ros__parameters:
      # Matches controller_frequency so the controller always sees fresh cells.
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: husky1_odom
      robot_base_frame: husky1_base_link
      use_sim_time: true
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: '[ [0.55, 0.38], [0.55, -0.38], [-0.55, -0.38], [-0.55, 0.38] ]'
      plugins:
      - obstacle_layer
      - fire_obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.5
        # Entry 019: 0.55 m leaves free band in ~1.8–2.2 m trails (footprint
        # half-width 0.38). 0.70 sealed thin trail necks.
        inflation_radius: 0.55
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # Entry 026: scan only — LiDAR raytrace must never share a buffer with
        # FIRE marks (shared-layer clearing wiped live fire lethals off-FOV).
        observation_sources: scan
        scan:
          topic: /husky1/scan
          # The lidar sits 0.845 m above the ground, so a scan return is only
          # ever at that height. The band below accepts it and rejects nothing
          # useful; raising min_obstacle_height above 0.845 would silently
          # discard every obstacle.
          min_obstacle_height: 0.0
          max_obstacle_height: 2.5
          clearing: true
          marking: true
          data_type: LaserScan
          # Raytracing out to 20 m clears stale cells across the whole rolling
          # window; marking is limited to 12 m where the scan is most reliable.
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          obstacle_max_range: 12.0
          obstacle_min_range: 0.0
          inf_is_valid: false
      # Entry 028 fallback: local KeepoutFilter made remembered LIDAR cells
      # lethal to RPP (82 collisions on fire-off t2trace). Keep a fire-only
      # ObstacleLayer so RPP sees live FIRE; it clears on BT ClearLocalCostmap.
      # Global FIRE lethals stay on KeepoutFilter so they can un-mark.
      fire_obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: fire_memory
        fire_memory:
          topic: /husky1/fire_memory_cloud
          min_obstacle_height: 0.0
          max_obstacle_height: 2.5
          clearing: false
          marking: true
          data_type: PointCloud2
          observation_persistence: 1.5
          obstacle_max_range: 25.0
          obstacle_min_range: 0.0
          raytrace_max_range: 25.0
          raytrace_min_range: 0.0
          inf_is_valid: false
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      # 5 Hz is enough for the global costmap: the behaviour tree only replans
      # at 1 Hz, so updating faster would burn CPU without changing behaviour.
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: husky1_map
      robot_base_frame: husky1_base_link
      use_sim_time: true
      footprint: '[ [0.55, 0.38], [0.55, -0.38], [-0.55, -0.38], [-0.55, 0.38] ]'
      # Entry 019b: non-rolling StaticLayer on trail-aligned PGM (free=trail,
      # occupied=off-trail). Entry 003 hang was rolling+StaticLayer; fixed-size
      # map avoids that. Lidar/fire ObstacleLayer overlays live hazards.
      # prior_obstacles kept published for RViz but not required for planning.
      rolling_window: false
      width: 120
      height: 120
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /husky1/prior_map
        track_unknown_space: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # Entry 026: scan only (see local_costmap fire isolation).
        observation_sources: scan
        scan:
          topic: /husky1/scan
          min_obstacle_height: 0.0
          max_obstacle_height: 2.5
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 40.0
          raytrace_min_range: 0.0
          obstacle_max_range: 30.0
          obstacle_min_range: 0.0
          inf_is_valid: false
        prior_obstacles:
          topic: /husky1/prior_obstacles
          min_obstacle_height: 0.0
          max_obstacle_height: 2.5
          clearing: false
          marking: true
          data_type: PointCloud2
          obstacle_max_range: 80.0
          obstacle_min_range: 0.0
          raytrace_max_range: 80.0
          raytrace_min_range: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.5
        inflation_radius: 0.55
      # Entry 021: KeepoutFilter overlays sensor-derived obstacle memory.
      # Filter runs after plugins; only raises costs. Occupancy 100 → lethal
      # via Costmap2D conversion. Mask+info are TransientLocal so resetLayers
      # can rehydrate keepouts without wiping StaticLayer trail geometry.
      filters: ["obstacle_memory_keepout"]
      obstacle_memory_keepout:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/husky1/obstacle_memory/filter_info"
      always_send_full_costmap: true
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    # The default behaviour tree replans at 1 Hz, so 5 Hz is ample and stops
    # Nav2 logging "planner missed its rate" warnings.
    expected_planner_frequency: 5.0
    use_sim_time: true
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 1.5
      # Dijkstra remains the planner (Entry 001 / 018).
      use_astar: false
      # Entry 019: trail PGM marks off-trail occupied; prefer not planning
      # through unknown. Keep true so lidar-cleared fringe cells still work.
      allow_unknown: true
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    global_frame: husky1_odom
    robot_base_frame: husky1_base_link
    transform_tolerance: 0.1
    use_sim_time: true
    # Issue B: default 2.0 s Spin collision projection exits immediately near
    # Path-A barrier keepout ("Collision Ahead") → Spin/fallback thrash and
    # reverse-then-recover after forward_only grace. In-place yaw only (no XY);
    # 0.0 disables ahead simulation so bank-owned Spin can finish reorient.
    simulate_ahead_time: 0.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
robot_state_publisher:
  ros__parameters:
    use_sim_time: true
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    # Boot lockstep with MPPI FollowPath vx_max=0.5 / wz_max=1.2 (GUI Fast).
    # Was 0.6 until first GUI rewrite — avoid pre-GUI mismatch (plan §3.1).
    max_velocity:
    - 0.5
    - 0.0
    - 1.2
    min_velocity:
    - -0.5
    - 0.0
    - -1.2
    max_accel:
    - 2.5
    - 0.0
    - 3.2
    max_decel:
    - -2.5
    - 0.0
    - -3.2
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
